<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Управління продуктами</title>
</head>
<body>
    <h1>Додати продукт</h1>
    <form action="/add" method="POST">
        <input type="text" name="name" placeholder="Назва" required>
        <input type="number" name="price" step="0.01" placeholder="Ціна" required>
        <input type="number" name="quantity" placeholder="Кількість" required>
        <button type="submit">Додати</button>
    </form>

    <h1>Список продуктів</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Назва</th>
                <th>Ціна</th>
                <th>Кількість</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.price }}</td>
                <td>{{ product.quantity }}</td>
                <td>
                    <a href="/edit/{{ product.id }}">Редагувати</a>
                    <!-- ЗМІНЕНО ТУТ: передаємо назву замість ID -->
                    <form action="/delete/{{ product.name }}" method="POST" style="display:inline;">
                        <button type="submit">Видалити</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
