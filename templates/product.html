<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>
    <!-- АЛЬТЕРНАТИВНИЙ РОБОЧИЙ CDN BOOTSTRAP (Стилі) -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <!-- Підключення вашого личного файла стилей з папки static -->
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('products') }}">
                <span class="fs-4 fw-bold">📦 Product Manager</span>
            </a>
            <div class="ms-auto">
                <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">LogOut</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">

            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Add product</h4>
                        <form action="" method="POST">
                            <div class="mb-2">
                                <input type="text" class="form-control" name="title" placeholder="Title" required>
                            </div>
                            <div class="mb-2">
                                <input type="number" step="0.01" class="form-control" name="price" placeholder="Price" required>
                            </div>
                            <div class="mb-3">
                                <input type="text" class="form-control" name="category" placeholder="Category">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Add</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Filter</h4>
                        <form action="" method="GET" class="d-flex gap-2">
                            <select name="category" class="form-select">
                                <option value="all" {% if choose_category == 'all' %}selected{% endif %}>All</option>
                                {% for cat in categories %}
                                    <option value="{{ cat }}" {% if choose_category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                            <button type="submit" class="btn btn-secondary">Submit</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Products</h4>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Title</th>
                                        <th>Price</th>
                                        <th>Category</th>
                                        <th class="text-end">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for prod in products %}
                                        <tr>
                                            <td class="fw-semibold">{{ prod.name }}</td>
                                            <td>${{ "%.2f"|format(prod.price) }}</td>
                                            <td><span class="badge bg-secondary">{{ prod.category if prod.category else 'None' }}</span></td>
                                            <td class="text-end">
                                                <a href="{{ url_for('edit', name_product=prod.name) }}" class="btn btn-warning btn-sm me-1">Edit</a>
                                                <a href="{{ url_for('delete', name_product=prod.name) }}" class="btn btn-danger btn-sm">Delete</a>
                                            </td>
                                        </tr>
                                    {% else %}
                                        <tr>
                                            <td colspan="4" class="text-center text-muted py-3">No products found</td>
                                        </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- АЛЬТЕРНАТИВНИЙ РОБОЧИЙ CDN BOOTSTRAP (Скрипти) -->
    <script src="https://cloudflare.com"></script>
</body>
</html>
