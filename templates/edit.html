<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагування товару</title>
</head>
<body>
    <h1>Редагувати товар: {{ product.name }}</h1>

    <form method="POST">
        <label>Назва: <input type="text" name="name" value="{{ product.name }}" required></label><br><br>
        <label>Ціна: <input type="number" name="price" value="{{ product.price }}" required></label><br><br>
        <label>Категорія: <input type="text" name="category" value="{{ product.category }}" required></label><br><br>
        <button type="submit">Зберегти зміни</button>
    </form>

    <br>
    <a href="{{ url_for('products_list') }}">Назад до списку</a>
</body>
</html>
