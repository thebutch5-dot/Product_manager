<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування товару</title>
    <link href="{{ url_for('static', filename='Bootstrap.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1 fw-bold text-white">Менеджер товарів</span>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-warning alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <div class="card shadow-sm bg-white" style="border: none; border-radius: 8px;">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4 fw-bold">Редагування товару</h2>
                        <form action="" method="POST">
                            <div class="mb-3">
                                <label for="title" class="form-label text-secondary small fw-bold">Назва</label>
                                <input type="text" class="form-control" id="title" name="title" value="{{ product.name }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="price" class="form-label text-secondary small fw-bold">Ціна</label>
                                <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ product.price }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="category" class="form-label text-secondary small fw-bold">Категорія</label>
                                <input type="text" class="form-control" id="category" name="category" value="{{ product.category }}">
                            </div>
                            <div class="mb-3">
                                <label for="quantity" class="form-label text-secondary small fw-bold">Кількість</label>
                                <input type="number" class="form-control" id="quantity" name="quantity" value="{{ product.quantity if product.quantity is not none else 0 }}" min="0" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 mt-2 py-2 fw-semibold text-white">Редагувати</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{{ url_for('products') }}" class="text-decoration-none small text-muted">Назад до списку</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
