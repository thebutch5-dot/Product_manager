<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагування: {{ product.name }}</title>
</head>
<body>

    <h2>Редагування товару: {{ product.name }}</h2>

    <form method="POST">
        <div>
            <label for="price">Ціна (price):</label>
            <input type="number" step="0.01" id="price" name="price" value="{{ product.price }}" required>
        </div>

        <div>
            <label for="category">Категорія (category):</label>
            <input type="text" id="category" name="category" value="{{ product.category }}" required>
        </div>

        <button type="submit">Зберегти</button>
        <a href="{{ url_for('products_list') }}">Назад до товарів</a>
    </form>

</body>
</html>
